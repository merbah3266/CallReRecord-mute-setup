name: build

on:
  schedule:
    - cron: "0 1 10 * *"
    - cron: "0 1 20 * *"
    - cron: "0 1 30 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            tool: aarch64-linux-android24-clang
            out: audio_patcher_arm64
          - arch: armv7
            tool: armv7a-linux-androideabi24-clang
            out: audio_patcher_armv7

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        id: cache-ndk
        with:
          path: $HOME/android-ndk-r26d
          key: ndk-r26d-ubuntu-26.04

      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip -d $HOME
          rm -f android-ndk-r26d-linux.zip

      - run: |
          NDK=$HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin

          $NDK/${{ matrix.tool }} \
            main.c \
            -o ${{ matrix.out }} \
            -Os \
            -ffunction-sections \
            -fdata-sections \
            -Wl,--gc-sections

          $NDK/llvm-strip ${{ matrix.out }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  remove_old:
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - run: |
          mkdir -p binaries
          rm -f binaries/* 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        with:
          name: clean_binaries
          path: binaries

  push:
    needs: remove_old
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: audio_patcher_arm64
          path: binaries
        continue-on-error: true

      - uses: actions/download-artifact@v5
        with:
          name: audio_patcher_armv7
          path: binaries
        continue-on-error: true

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          mkdir -p binaries

          git add -A binaries

          git commit -m "update binaries $(date '+%Y-%m-%d %H:%M:%S')" || true

          git push --force origin main
