name: build

on:
  schedule:
    - cron: "0 1 10 * *"
    - cron: "0 1 20 * *"
    - cron: "0 1 30 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            tool: aarch64-linux-android24-clang
            out: audio_patcher_arm64

          - arch: armv7
            tool: armv7a-linux-androideabi24-clang
            out: audio_patcher_armv7

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: $HOME/android-ndk-r26d
          key: ndk-r26d-linux

      - name: Install NDK (if not cached)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip -d $HOME

      - name: Build (${{ matrix.arch }})
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M:%S')

          $HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.tool }} \
            main.c -o ${{ matrix.out }} \
            -Os \
            -ffunction-sections -fdata-sections \
            -fno-asynchronous-unwind-tables \
            -fno-unwind-tables \
            -Wl,--gc-sections \
            -DBUILD_DATE="\"$DATE\""

          $HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Flatten binaries
        run: |
          mv binaries/*/* binaries/ 2>/dev/null || true
          rm -rf binaries/*/ 2>/dev/null || true

      - name: Commit & Push (always)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add binaries

          git commit --allow-empty -m "update binaries $(date '+%Y-%m-%d %H:%M:%S')"
          git push
