name: build

on:
  schedule:
    - cron: "0 1 10 * *"
    - cron: "0 1 20 * *"
    - cron: "0 1 30 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            tool: aarch64-linux-android24-clang
            out: audio_patcher_arm64

          - arch: armv7
            tool: armv7a-linux-androideabi24-clang
            out: audio_patcher_armv7

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: $HOME/android-ndk-r26d
          key: ndk-r26d

      - name: Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip -d $HOME

      - name: Build
        run: |
          NDK=$HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin

          $NDK/${{ matrix.tool }} \
            main.c -o ${{ matrix.out }} \
            -Os \
            -ffunction-sections -fdata-sections \
            -Wl,--gc-sections \
            -DBUILD_DATE="\"$(date '+%Y-%m-%d %H:%M:%S')\""

          $NDK/llvm-strip ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: audio_patcher_arm64
          path: binaries

      - name: Download armv7
        uses: actions/download-artifact@v4
        with:
          name: audio_patcher_armv7
          path: binaries

      - name: Force overwrite push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # حذف النسخة القديمة من git
          git rm -rf binaries || true

          # إضافة النسخة الجديدة
          git add binaries

          # commit دائماً (حتى لو نفس الملفات)
          git commit -m "update binaries $(date '+%Y-%m-%d %H:%M:%S')" || true

          # overwrite كامل للريبو
          git push --force origin main
