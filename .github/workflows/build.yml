name: build

on:
  schedule:
    - cron: "0 1 10 * *"
    - cron: "0 1 20 * *"
    - cron: "0 1 30 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            tool: aarch64-linux-android24-clang
            out: audio_patcher_arm64

          - arch: armv7
            tool: armv7a-linux-androideabi24-clang
            out: audio_patcher_armv7

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache-ndk
        with:
          path: $HOME/android-ndk-r26d
          key: ndk-r26d-${{ runner.os }}

      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y wget unzip

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip \
            -O android-ndk-r26d-linux.zip

          unzip -q android-ndk-r26d-linux.zip -d "$HOME"

          rm -f android-ndk-r26d-linux.zip

      - run: |
          NDK="$HOME/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$NDK/${{ matrix.tool }}" \
            main.c \
            -o "${{ matrix.out }}" \
            -Os \
            -ffunction-sections \
            -fdata-sections \
            -Wl,--gc-sections

          "$NDK/llvm-strip" "${{ matrix.out }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  push:
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - run: |
          rm -rf binaries
          mkdir -p binaries

      - uses: actions/download-artifact@v7
        with:
          name: audio_patcher_arm64
          path: binaries

      - uses: actions/download-artifact@v7
        with:
          name: audio_patcher_armv7
          path: binaries

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A binaries

          git commit \
            -m "update binaries $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            || true

          git push origin HEAD:main
